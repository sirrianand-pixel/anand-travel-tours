<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Anand Travel Tours</title>

    <link rel="stylesheet" href="../css/register.css">

</head>

<body>

<div class="container">

    <img
        src="../images/logo.jpg"
        alt="Anand Travel Tours"
        class="auth-logo"
    >

    <h1>Create Account</h1>

    <form id="registerForm">

        <input
    type="text"
    id="full_name"
    placeholder="Full Name"
    autocomplete="name"
    required
>

<input
    type="email"
    id="email"
    placeholder="Email"
    autocomplete="email"
    required
>

<input
    type="tel"
    id="phone"
    placeholder="Phone Number"
    autocomplete="tel"
    required
>

<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="new-password"
    required
>

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm Password"
    autocomplete="new-password"
    required
>

        <button type="submit">
            Create Account
        </button>

    </form>

    <p class="auth-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>

</div>


<script src="../js/register.js"></script>

</body>

</html>
