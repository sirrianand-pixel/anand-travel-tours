<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Your Tour - Anand Travel Tours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet"
>

    <link rel="stylesheet" href="../css/booking.css">

</head>

<body>

    <div class="booking-container">

        <div class="booking-card">

            <h1>Book Your Tour</h1>

            <p class="subtitle">
                Complete the form below to reserve your trip.
            </p>


            <div id="packageSummary">
                Loading package...
            </div>


            <form id="bookingForm">

                <input
                    type="text"
                    id="full_name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="tel"
                    id="phone"
                    placeholder="Phone Number"
                    required
                >

                <label for="travel_date">
                    Travel Date
                </label>

                <input
                    type="date"
                    id="travel_date"
                    required
                >

                <label for="persons">
                    Number of Persons
                </label>

                <input
                    type="number"
                    id="persons"
                    min="1"
                    value="2"
                    required
                >

                <textarea
                    id="message"
                    placeholder="Special requests (optional)"
                    rows="4"
                ></textarea>


                <button type="submit">
                    Confirm Booking
                </button>

            </form>


            <p id="bookingMessage"></p>

        </div>

    </div>


    <script src="../js/booking.js"></script>

</body>

</html>
