<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Anand Travel Tours</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="container">

    <img
        src="../images/logo.jpg"
        alt="Anand Travel Tours"
        class="auth-logo"
    >

    <h1>Reset Password</h1>
    <p style="color: rgba(255, 255, 255, 0.85); font-size: 14px; margin-bottom: 20px; line-height: 1.5;">
        Create a new, strong password for your account.
    </p>

    <form id="resetPasswordForm">

        <input
            type="password"
            id="newPassword"
            placeholder="New Password (min 6 characters)"
            required
            minlength="6"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm New Password"
            required
            minlength="6"
        >

        <button type="submit" id="submitBtn">
            Reset Password
        </button>

    </form>

    <div id="statusMessage" style="display: none; margin-top: 18px; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5;"></div>

    <p class="auth-link">
        <a href="login.html">Back to Login</a>
    </p>

</div>
<script src="../js/reset-password.js"></script>

</body>
</html>
