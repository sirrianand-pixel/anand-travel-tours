<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Anand Travel Tours</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="container">

    <img
        src="../images/logo.jpg"
        alt="Anand Travel Tours"
        class="auth-logo"
    >

    <h1>Welcome Back</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <div style="display: flex; justify-content: flex-end; margin-top: -4px; margin-bottom: 4px;">
            <a href="forgot-password.html" style="color: #f2c96b; font-size: 13px; text-decoration: none; font-weight: 500;">Forgot Password?</a>
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <p class="auth-link">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </p>

</div>
<script src="../js/login.js"></script>

</body>
</html>
