<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Anand Travel Tours</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="container">

    <img
        src="../images/logo.jpg"
        alt="Anand Travel Tours"
        class="auth-logo"
    >

    <h1>Forgot Password</h1>
    <p style="color: rgba(255, 255, 255, 0.85); font-size: 14px; margin-bottom: 20px; line-height: 1.5;">
        Enter your registered email address and we'll send you a link to reset your password.
    </p>

    <form id="forgotPasswordForm">

        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            required
        >

        <button type="submit" id="submitBtn">
            Send Reset Link
        </button>

    </form>

    <div id="statusMessage" style="display: none; margin-top: 18px; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5;"></div>

    <p class="auth-link">
        Remember your password?
        <a href="login.html">Back to Login</a>
    </p>

</div>
<script src="../js/forgot-password.js"></script>

</body>
</html>
